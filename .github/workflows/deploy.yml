name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e

            REPO_URL="https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
            APP_DIR="${{ secrets.SERVER_PATH }}"

            # Clone on first deploy, pull on subsequent ones
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            # Write environment file
            cat > .env << ENVEOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}
            PORT=${{ secrets.PORT }}
            SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            ENVEOF

            # Install dependencies
            npm ci --omit=dev

            # Generate Prisma client and run migrations
            npx prisma generate
            npx prisma migrate deploy

            # Build TypeScript
            npm run build

            # Start or restart with PM2
            if pm2 list | grep -q "smart-invoicer"; then
              pm2 restart smart-invoicer
            else
              pm2 start dist/index.js --name smart-invoicer
            fi

            # Save PM2 process list so it survives reboots
            pm2 save
